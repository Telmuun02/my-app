# React SPA-г түгээх nginx тохиргоо (Dockerfile-ийн prod шатанд хуулагдана).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- SPA routing ---
    # react-router нь замуудыг ХӨТӨЧ дээр удирддаг. Сервер дээр /books/42
    # гэсэн файл байхгүй тул шууд хандах/refresh дарахад 404 гарна.
    # try_files: эхлээд яг тэр файлыг, дараа нь хавтсыг, олдохгүй бол
    # index.html-ийг буцаана → цаашдыг react-router шийднэ.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Кэшлэлт ---
    # Vite нь файлын нэрэнд hash оруулдаг (index-BQoLEWTT.js). Агуулга
    # өөрчлөгдвөл нэр нь өөрчлөгддөг тул удаан кэшлэх нь аюулгүй.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html-ийг ХЭЗЭЭ Ч кэшлэхгүй — энэ нь шинэ hash-тай файлууд руу
    # заадаг цорын ганц зам. Кэшлэвэл хэрэглэгч хуучин хувилбарт гацна.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
