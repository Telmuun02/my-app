; Prod дээр нэг контейнер дотор гурван процесс. initial.sh нь энэ файлыг
; аргументаараа хүлээж авна (Dockerfile дахь ENTRYPOINT/CMD хос).
;
; Dev дээр ХЭРЭГЛЭГДЭХГҮЙ — тэнд compose нь backend, queue гэсэн тусдаа
; service үүсгэдэг.

[supervisord]
; nodaemon=true — заавал. Supervisor ар тал руу салбарлавал PID 1 дуусаж,
; контейнер унтарна.
nodaemon=true
user=root

; --------------------------------------------------------------- php-fpm ---
; PHP-г ГҮЙЦЭТГЭДЭГ хэсэг. Зэрэгцээ ажиллах чадвар нь php-fpm.conf доторх
; pm.max_children-ээр тодорхойлогдоно.
;
; priority=10 — nginx-ээс ӨМНӨ асна. Эсрэгээр бол nginx эхний хэдэн хүсэлтэд
; "502 Bad Gateway" буцаана (9000 порт хараахан нээгдээгүй байх тул).
[program:php-fpm]
priority=10
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ----------------------------------------------------------------- nginx ---
; Холболт хүлээж авах, статик файл өгөх, PHP хүсэлтийг 9000 руу дамжуулах.
; `daemon off;` — supervisor процессыг нүдэн дээрээ барих ёстой.
[program:nginx]
priority=20
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ----------------------------------------------------------------- queue ---
; Cloud Tasks руу шилжсэний дараа ЭНЭ БЛОК УСТАНА. Тэр үед контейнер хоёр
; процесстой болж, эцэст нь FrankenPHP-тэй бол нэг процесс болно.
[program:queue]
priority=30
directory=/app
command=php artisan queue:work --tries=3 --backoff=5
autostart=true
autorestart=true
; queue:work нь SIGTERM авмагц шинэ ажил авахаа болиод гарт байгаагаа
; дуусгана. Анхдагч 10 секунд CreateLoanJob-д хүрэлцэхгүй байж мэднэ.
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
