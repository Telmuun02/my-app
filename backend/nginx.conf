# Laravel-ийг nginx + php-fpm хосоор түгээх тохиргоо (prod шатанд хуулагдана).
#
# nginx нь PHP-г ГҮЙЦЭТГЭДЭГГҮЙ. Түүний ажил: холболт хүлээж авах, статик
# файлыг шууд өгөх, PHP файлын хүсэлтийг 9000 порт дээр сонсож буй php-fpm рүү
# дамжуулах. Зэрэгцээ ажиллах чадварыг php-fpm-ийн worker-ийн тоо шийднэ.

server {
    listen 8000;
    server_name _;

    root /app/public;
    index index.php;
    charset utf-8;

    # Логийг файл руу биш контейнерийн урсгал руу — `docker logs`-оор харагдана.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Зургийн байршуулалт Cloudinary руу Laravel-ээр дамждаг тул анхдагч 1MB
    # хүрэлцэхгүй.
    client_max_body_size 12m;

    # Бүх зам index.php руу. Файл байвал шууд өгнө (build/зураг), эс бөгөөс
    # Laravel-ийн router шийднэ.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        # $realpath_root — symlink-ийг задалсан бодит зам. Laravel-ийн албан
        # ёсны тохиргоо үүнийг ашигладаг: deploy үед хавтас symlink-ээр
        # солигддог тохиолдолд opcache хуучин замыг барьж авахаас сэргийлнэ.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
    }

    # .env, .git зэрэг цэгээр эхэлсэн бүхнийг хаана (.well-known-оос бусад).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
