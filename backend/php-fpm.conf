; php-fpm pool-ийн тохиргоо → /usr/local/etc/php-fpm.d/zzz-app.conf
;
; Файлууд цагаан толгойн дарааллаар ачаалагддаг (docker.conf → www.conf →
; zz-docker.conf), сүүлийнх нь давамгайлна. Тиймээс нэр нь "zzz-" —
; image-ийн анхдагчуудыг дарж бичихийн тулд.
;
; docker.conf аль хэдийн тохируулсан зүйлсийг ЭНД давтахгүй:
;   listen = 9000            ← nginx энэ порт руу дамжуулна
;   clear_env = no           ← Docker-ийн орчны хувьсагч PHP руу хүрнэ
;   catch_workers_output = yes ← worker-ийн лог stderr рүү

[www]

; ---------------------------------------------------------------------------
; pm.max_children — ЭНЭ бол чиний зэрэгцээ ажиллах чадвар.
;
; Нэг зэрэг боловсруулах хүсэлтийн дээд тоо. 11 дэх хүсэлт хүлээнэ.
;
; Тоог санамсаргүй сонгож болохгүй — санах ойгоор хязгаарлагдана:
;
;     max_children = (боломжит RAM) / (нэг worker-ийн санах ой)
;
; Laravel-ийн нэг worker ойролцоогоор 40-60 MB иддэг. 512 MB контейнерт
; nginx, php-fpm master, OS-д ~150 MB үлдээвэл:
;
;     (512 - 150) / 50 ≈ 7 ... 10
;
; Хэт өндөр тавих нь хамгийн түгээмэл production алдаа: RAM дүүрч, OOM killer
; процессыг хөнөөнө. Хэт бага бол хүсэлт дараалалд орно. Санах ойгоо
; нэмэгдүүлбэл энэ тоог хамт өсгө.
; ---------------------------------------------------------------------------
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Worker бүр 500 хүсэлт боловсруулсны дараа өөрийгөө сэргээнэ. Гуравдагч
; сангийн санах ойн алдагдал хуримтлагдахаас сэргийлнэ.
pm.max_requests = 500

; Хүсэлт 30 секундээс удвал stack trace-ийг лог руу бичнэ — аль код удааширч
; байгааг олоход.
request_slowlog_timeout = 30s
slowlog = /proc/self/fd/2

; Мөнхөд гацсан хүсэлтийг таслана. nginx-ийн fastcgi_read_timeout (анхдагч
; 60s) -аас БАГА байх ёстой, эс бөгөөс nginx эхэлж 504 буцаагаад php-fpm
; ажлаа үргэлжлүүлсээр байна.
request_terminate_timeout = 55s
