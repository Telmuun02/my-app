; Зөвхөн PROD шатанд хуулагдана — dev-д ХЭРЭГЛЭХГҮЙ (доорх шалтгааныг үз).
;
; Opcache нь эмхэтгэсэн PHP кодыг санах ойд хадгална. Үүнгүйгээр PHP нь
; хүсэлт БҮРД эх файл бүрийг дахин уншиж, дахин эмхэтгэдэг.

opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; validate_timestamps=0 — файл өөрчлөгдсөн эсэхийг ОГТ шалгахгүй.
;
; Prod дээр зөв: image нь өөрчлөгдөшгүй, файл хэзээ ч солигдохгүй тул
; шалгалт нь цэвэр үрэлгээн.
;
; Dev дээр СҮЙРЭЛ: чиний засвар хэзээ ч тусахгүй, контейнер дахин асаах
; хүртэл хуучин код ажилласаар байна. Тийм учраас энэ файлыг base шатанд
; биш, зөвхөн prod шатанд хуулдаг.
opcache.validate_timestamps=0
